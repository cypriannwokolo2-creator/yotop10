services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: yotop10_dev
    ports:
      - "3100:3000"
      - "8100:8000"
    environment:
      - NODE_ENV=development
      - CORS_ORIGINS=https://yotop10.com,https://www.yotop10.com
      - NEXT_PUBLIC_API_URL=https://yotop10.com/api
      - NEXT_PUBLIC_SITE_URL=https://yotop10.com
      - MONGODB_URI=mongodb://mongodb:27017/yotop10
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=yotop10
      - MONGO_USERNAME=yotop10_admin
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ES_PASSWORD=${ES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_URL=http://yotop10_dev:8000/api
    volumes:
      - ./backend/src:/app/backend/src
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./backend/tsconfig.json:/app/backend/tsconfig.json
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
      - ./frontend/next.config.ts:/app/frontend/next.config.ts
      - ./frontend/postcss.config.mjs:/app/frontend/postcss.config.mjs
      - ./backend/uploads:/app/backend/uploads
      - ./backend/uploads:/app/uploads
      - next_cache:/app/frontend/.next/cache
    networks:
      - yotop10_frontend_net
      - yotop10_backend_net
    extra_hosts:
      - "yotop10.fun:host-gateway"

volumes:
  next_cache:

networks:
  yotop10_frontend_net:
    external: true
    name: yotop10prod_frontend_net
  yotop10_backend_net:
    external: true
    name: yotop10prod_backend_net
